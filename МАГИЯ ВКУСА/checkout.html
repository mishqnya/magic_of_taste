<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформление заказа | Магия вкуса</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/adaptive.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="img/favicon-48.png">
</head>

<body>

<header class="header">

    <div class="container">

        <nav class="navbar">

            <a href="index.html" class="logo">
                <img src="img/logo.png" alt="">
            </a>

            <ul class="menu">
                <li><a href="index.html">Главная</a></li>
                <li><a href="cake.html">Торты</a></li>
                <li><a href="cart.html">Корзина</a></li>
            </ul>

        </nav>

    </div>

</header>

<section class="checkout">

<div class="container">

<h1 class="page-title">Оформление заказа</h1>

<div class="checkout-box">

<div class="checkout-form">

<div class="field">
<h3>Имя</h3>
<input type="text" id="clientName" placeholder="Введите имя">
</div>

<div class="field">
<h3>Телефон</h3>
<input type="tel" id="clientPhone" placeholder="+7 (...)">
</div>

<div class="field">
<h3>Дата получения</h3>
<input type="date" id="clientDate">
</div>

<div class="field">
<h3>Время получения</h3>
<input type="time" id="clientTime">
</div>

<div class="field">
<h3>Комментарий</h3>
<textarea id="clientComment" placeholder="Дополнительные пожелания"></textarea>
</div>

<button class="buy-btn" id="confirmOrder">
Подтвердить заказ
</button>

</div>

<div class="checkout-order">

<h2>Ваш заказ</h2>

<div id="orderList"></div>

<h2 style="margin-top:35px;">
Итого:
<span id="orderTotal">0 ₽</span>
</h2>

</div>

</div>

</div>

</section>

<script src="js/checkout.js"></script>

</body>
</html>
